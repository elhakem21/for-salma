<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أمي الحبيبة</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: #ffca3a; font-family: 'Arial', sans-serif; overflow: hidden; height: 100vh; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; }
        .overlay { position: absolute; top: 15%; width: 100%; text-align: center; pointer-events: none; }
        .center-text { font-size: 50px; color: #ffca3a; text-shadow: 0 0 20px #ffca3a; font-weight: bold; }
        .message-area { position: absolute; bottom: 30px; width: 100%; text-align: center; padding: 20px; font-size: 16px; color: #fff; z-index: 10; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div class="overlay">
    <div class="center-text">أمي الحبيبة</div>
</div>

<div class="message-area">
    حرك الشاشة بإصبعك لتستكشف القلب.. دمتِ لي نوراً وحياة.
</div>

<div id="canvas-container"></div>

<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // إضافة التحكم (OrbitControls)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // لجعل الحركة ناعمة (Smooth)

    const scale = window.innerWidth < 600 ? 0.2 : 0.25;
    const particles = new THREE.BufferGeometry();
    const count = 5000;
    const positions = new Float32Array(count * 3);
    
    for(let i=0; i<count*3; i+=3) {
        let t = Math.random() * Math.PI * 2;
        positions[i] = 16 * Math.pow(Math.sin(t), 3) * scale;
        positions[i+1] = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
        positions[i+2] = (Math.random() - 0.5) * 3;
    }
    
    particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({color: 0xffca3a, size: 0.03});
    const heart = new THREE.Points(particles, material);
    scene.add(heart);

    camera.position.z = 5;

    function animate() {
        requestAnimationFrame(animate);
        controls.update(); // ضروري لتشغيل التحكم
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
