<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S | قلب البرمجة</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #ff3e3e; font-family: 'Courier New', monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .overlay { position: absolute; top: 10%; width: 100%; text-align: center; pointer-events: none; }
        .center-s { font-size: 80px; color: #fff; text-shadow: 0 0 20px #ff3e3e; font-weight: bold; }
        
        .log-area { position: absolute; bottom: 20px; left: 20px; width: 280px; border: 1px solid #ff3e3e; 
                    padding: 15px; background: rgba(0,0,0,0.7); font-size: 13px; line-height: 1.6; z-index: 10; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="overlay">
    <div class="center-s">S</div>
</div>

<div class="log-area">
    > سلمى.. يا أجدع واحدة عرفتها.<br>
    > طيبة، وأحلى هبلة قابلتها.<br>
    > بتغلبني وتجنني بس حنيتها مفيش زيها.<br>
    > غبية شوية بس بموت فيها.. دي دنيتي.
</div>

<div id="canvas-container"></div>

<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // ضبط الحجم حسب الجهاز
    const scale = window.innerWidth < 600 ? 0.2 : 0.25;
    
    const particles = new THREE.BufferGeometry();
    const count = 4000;
    const positions = new Float32Array(count * 3);
    for(let i=0; i<count*3; i+=3) {
        let t = Math.random() * Math.PI * 2;
        positions[i] = 16 * Math.pow(Math.sin(t), 3) * scale;
        positions[i+1] = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
        positions[i+2] = (Math.random() - 0.5) * 2;
    }
    particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({color: 0xff3e3e, size: 0.04});
    const heart = new THREE.Points(particles, material);
    scene.add(heart);

    camera.position.z = 5;

    function animate() {
        requestAnimationFrame(animate);
        heart.rotation.y += 0.005; // دوران بطيء واحترافي
        renderer.render(scene, camera);
    }
    animate();

    // تحديث الحجم عند تدوير الموبايل
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
