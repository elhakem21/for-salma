<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #050505; color: #ff3e3e; font-family: 'Courier New', monospace; 
               display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        .container { text-align: center; }
        
        /* القلب وحرف S */
        .heart-wrapper { position: relative; display: inline-block; font-size: 100px; 
                         animation: pulse 1.5s infinite; }
        .letter-s { position: absolute; top: 20px; left: 30px; font-size: 50px; 
                    color: white; font-weight: bold; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        .loader { margin-top: 20px; font-size: 18px; color: #888; }
        
        #content { display: none; text-align: center; color: #fff; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container" id="loader-box">
    <div class="heart-wrapper">
        ❤<span class="letter-s">S</span>
    </div>
    <div class="loader">جاري تهيئة البيانات... <span id="percent">0%</span></div>
</div>

<div id="content">
    <h1 style="color: #ff3e3e;">سلمى</h1>
    <p>أنتِ لستِ مجرد اسم في قائمة بياناتي،<br>
    أنتِ الكود الذي أعاد ترتيب أولوياتي.</p>
</div>

<script>
    let p = 0;
    let interval = setInterval(() => {
        p += 2;
        document.getElementById('percent').innerText = p + '%';
        if(p >= 100) {
            clearInterval(interval);
            document.getElementById('loader-box').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }
    }, 80);
</script>

</body>
</html>
