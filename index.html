<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #050505;
            color: #ff4d6d;
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* شكل القلب المكون من كلمة Love */
        .heart-shape {
            position: relative;
            font-size: 20px;
            text-align: center;
            line-height: 1.2;
            text-shadow: 0 0 8px #ff4d6d;
            animation: pulse 2s infinite;
        }

        /* الحرف S في المنتصف */
        .center-s {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: white;
            text-shadow: 0 0 20px #fff;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* تأثير خطوط المسح */
        .scanline {
            width: 100%; height: 2px; background: rgba(255, 255, 255, 0.05);
            position: absolute; animation: scan 8s linear infinite;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="heart-shape">
    Love Love Love Love Love Love<br>
    Love Love Love Love Love Love Love Love<br>
    Love Love Love Love Love Love Love Love<br>
    Love Love Love Love Love Love<br>
    Love Love Love Love<br>
    Love Love<br>
    Love
    <div class="center-s">S</div>
</div>

</body>
</html>
