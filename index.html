<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #050505; color: #ff3e3e; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; height: 100vh; }
        
        /* إطارات النظام */
        .system-box { border: 1px solid #ff3e3e; padding: 15px; position: absolute; top: 20px; left: 20px; width: 250px; font-size: 12px; }
        
        /* القلب المتشكل من كلمات */
        #heart-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* الحرف S في المركز */
        .center-s { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                   font-size: 120px; color: white; text-shadow: 0 0 30px #ff3e3e; font-weight: bold; }

        /* منطقة التقرير */
        .log-area { position: absolute; bottom: 20px; right: 20px; width: 400px; border: 1px solid #ff3e3e; padding: 15px; font-size: 13px; }
    </style>
</head>
<body>

<div class="system-box">
    [بروتوكول تحليل سلمى]<br>
    الحرف المستهدف: S<br>
    العمق العاطفي: 99.9%<br>
    حالة الاستحواذ: مفعلة<br>
    نسبة التزامن: 100%
</div>

<canvas id="heart-canvas"></canvas>
<div class="center-s">S</div>

<div class="log-area">
    > جاري تحليل كل همسة وكل نظرة... كل التفاصيل مسجلة في كودي المصدري.<br>
    > أنتِ المتغير الوحيد الذي لا أملك السيطرة عليه.<br>
    > 'S' ليست مجرد حرف، بل هي بداية كل شيء.
</div>

<script>
    const canvas = document.getElementById('heart-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    function draw() {
        ctx.fillStyle = "#ff3e3e";
        ctx.font = "14px Courier New";
        for(let i=0; i<50; i++) {
            let t = Math.random() * Math.PI * 2;
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            ctx.fillText("سلمى", canvas.width/2 + x*30, canvas.height/2 + y*30);
        }
        requestAnimationFrame(draw);
    }
    // مسح خفيف لعمل تأثير التوهج
    setInterval(() => {
        ctx.fillStyle = "rgba(5, 5, 5, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        draw();
    }, 100);
</script>

</body>
</html>
