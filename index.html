<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #050505; color: #ff3e3e; font-family: 'Courier New', monospace; 
               display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        
        #heart-canvas {
            text-align: center;
            width: 350px;
            text-shadow: 0 0 10px #ff3e3e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        
        .center-s { font-size: 80px; color: white; text-shadow: 0 0 20px #ff3e3e; font-weight: bold; }
    </style>
</head>
<body>

<div id="heart-canvas">
    <div style="font-size: 14px; line-height: 1.2; letter-spacing: 2px;">
        Love Love Love Love Love Love<br>
        Love Love Love Love Love Love Love Love<br>
        Love Love Love Love Love Love Love Love<br>
        Love Love Love Love Love Love<br>
        Love Love Love Love<br>
        Love Love<br>
        Love
    </div>
    <div class="center-s">S</div>
</div>

</body>
</html>
