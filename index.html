<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجرة حب أمي</title>
    <style>
        body { margin: 0; background: #050505; color: #ffca3a; font-family: 'Arial', sans-serif; overflow: hidden; height: 100vh; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; }
        .overlay { position: absolute; top: 10%; width: 100%; text-align: center; pointer-events: none; }
        .center-text { font-size: 40px; color: #ffca3a; text-shadow: 0 0 15px #ffca3a; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div class="overlay">
    <div class="center-text">مجرة حب أمي</div>
</div>

<div id="canvas-container"></div>

<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    
    // دالة لإنشاء "صورة" (إيموجي) كجزيء في الفضاء
    function createEmojiSprite(emoji) {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.font = '48px serif';
        ctx.fillText(emoji, 0, 48);
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture });
        return new THREE.Sprite(material);
    }

    const icons = ['❤️', '✨', '🌸', '🎁', '🌹', '💛'];
    const scale = 3;
    
    // إنشاء 100 "رمز حب" وتوزيعها على شكل قلب في الفضاء
    for(let i=0; i<100; i++) {
        let t = Math.random() * Math.PI * 2;
        let sprite = createEmojiSprite(icons[i % icons.length]);
        
        let x = 16 * Math.pow(Math.sin(t), 3) * 0.2;
        let y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.2;
        let z = (Math.random() - 0.5) * 1;
        
        sprite.position.set(x, y, z);
        sprite.scale.set(0.3, 0.3, 0.3);
        scene.add(sprite);
    }

    camera.position.z = 5;

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
