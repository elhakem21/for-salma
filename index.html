<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #050505;
            color: white;
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* تأثير الخط المتوهج */
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5), 0 0 20px rgba(255, 77, 109, 0.3);
            font-size: 80px;
            position: relative;
        }

        /* تأثير مؤشر الكتابة الوامض */
        .terminal-cursor {
            border-right: 2px solid #ff4d6d;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #ff4d6d; }
        }

        /* تأثير خطوط المسح (Scanline) */
        .scanline {
            width: 100%; height: 100px; z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.02) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1; position: absolute; bottom: 100%;
            animation: scanline 10s linear infinite;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="glow-text">
    <span class="terminal-cursor">S</span>
</div>

</body>
</html>
