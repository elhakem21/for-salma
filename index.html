<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: #050505; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="heart"></canvas>
    <script>
        const canvas = document.getElementById('heart');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const heartPoints = [];
        
        // معادلة رسم القلب الرياضية
        for (let i = 0; i < 2000; i++) {
            let t = Math.random() * Math.PI * 2;
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            heartPoints.push({x: x * 15, y: y * 15});
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.target = heartPoints[Math.floor(Math.random() * heartPoints.length)];
                this.size = Math.random() * 2;
            }
            draw() {
                ctx.fillStyle = "#ff4d6d";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ff4d6d";
                ctx.fillRect(this.x + canvas.width/2, this.y + canvas.height/2, this.size, this.size);
            }
            update() {
                this.x += (this.target.x - this.x) * 0.05;
                this.y += (this.target.y - this.y) * 0.05;
            }
        }

        for (let i = 0; i < 1500; i++) particles.push(new Particle());

        function animate() {
            ctx.fillStyle = "rgba(5, 5, 5, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
