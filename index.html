<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S | نظام التواصل الخاص</title>
    <style>
        body { background: #050505; color: #ff3e3e; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .container { border: 1px solid #ff3e3e; padding: 20px; max-width: 800px; margin: auto; box-shadow: 0 0 15px rgba(255, 62, 62, 0.2); }
        
        h1 { text-align: center; border-bottom: 1px solid #ff3e3e; padding-bottom: 10px; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #333; padding: 15px; background: #0a0a0a; }
        
        .love-status { color: #fff; font-size: 1.2em; text-align: center; margin-top: 20px; padding: 10px; background: #1a0505; }
        .heart { color: #ff3e3e; font-size: 50px; text-align: center; margin: 10px 0; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body>

<div class="container">
    <h1>[نظام تحليل ملف: سلمى]</h1>
    
    <div class="heart">❤</div>

    <div class="data-grid">
        <div class="card">
            <strong>الاسم:</strong> سلمى<br>
            <strong>الحالة:</strong> طيبة القلب جداً
        </div>
        <div class="card">
            <strong>التصنيف:</strong> جميلة وتسمع الكلام
        </div>
        <div class="card">
            <strong>ملاحظات المطور (Debugging):</strong><br>
            - هبلة شوية (بس أحلى هبلة)<br>
            - بتغلبني بس بتراضيني
        </div>
        <div class="card">
            <strong>الاستنتاج:</strong><br>
            ذكية أحياناً.. وغبية في بعض الأوقات (أحبها بكل حالاتها)
        </div>
    </div>

    <div class="love-status">
        > حالة التزامن: 100% - أنتِ كل ما أريد في هذا العالم.
    </div>
</div>

</body>
</html>
