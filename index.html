<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S | رسالة خاصة</title>
    <style>
        body { margin: 0; background: #080808; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        
        /* القلب المتوهج */
        #heart { font-size: 80px; color: #e63946; filter: drop-shadow(0 0 15px #e63946); animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        /* النصوص */
        .message { margin-top: 30px; text-align: center; max-width: 600px; padding: 20px; line-height: 2; opacity: 0.8; }
        .name { font-size: 24px; color: #e63946; font-weight: bold; }
        
        /* تأثير الظهور التدريجي */
        .fade-in { animation: fadeIn 3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="heart" class="fade-in">❤</div>

<div class="message fade-in">
    <div class="name">إلى سلمى...</div>
    <p>أردتُ أن أبتكر شيئاً مختلفاً، شيئاً يربط المنطق بالمشاعر.<br>
    في عالم مليء بالأرقام والبيانات، أنتِ الوحيدة التي تخرج عن كل قواعدي.<br>
    هذا المكان صُمم ليكون مساحة هادئة، كما هي ملامحك.</p>
</div>

<script>
    // تأثير إضافي بسيط عند الضغط على أي مكان
    document.body.addEventListener('click', () => {
        document.body.style.backgroundColor = "#0d0d0d";
        alert("سأظل أهتم بكل تفاصيلك.");
    });
</script>

</body>
</html>
