<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #050505; color: #ff3e3e; font-family: 'Courier New', monospace; 
               margin: 0; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #heart-container { position: relative; width: 400px; height: 400px; }
        
        /* الحرف في المركز */
        .center-s { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                   font-size: 80px; color: white; text-shadow: 0 0 20px #ff3e3e; font-weight: bold; }

        /* النصوص التي تشكل القلب */
        .love-particle { position: absolute; font-size: 14px; color: #ff3e3e; text-shadow: 0 0 5px #ff3e3e; animation: fadeIn 2s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="heart-container">
    <div class="center-s">S</div>
</div>

<script>
    const container = document.getElementById('heart-container');
    const points = [];

    // معادلة القلب الرياضية لتوليد مواقع النصوص
    for (let i = 0; i < 60; i++) {
        let t = (i / 60) * Math.PI * 2;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        
        // تحويل الإحداثيات لمركز الشاشة
        let left = 200 + x * 12;
        let top = 200 + y * 12;
        
        let span = document.createElement('span');
        span.innerHTML = "Love";
        span.className = 'love-particle';
        span.style.left = left + 'px';
        span.style.top = top + 'px';
        span.style.animationDelay = (i * 0.05) + 's'; // ظهور متتابع
        container.appendChild(span);
    }
</script>

</body>
</html>
