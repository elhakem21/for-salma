<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S | قلب البرمجة</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #ff3e3e; font-family: 'Courier New', monospace; }
        #text-overlay { position: absolute; top: 10%; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        .log-area { position: absolute; bottom: 20px; left: 20px; width: 300px; border: 1px solid #ff3e3e; padding: 15px; background: rgba(0,0,0,0.6); font-size: 13px; z-index: 10; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="text-overlay">
    <h1 style="text-shadow: 0 0 20px #ff3e3e;">S</h1>
</div>

<div class="log-area">
    > سلمى.. يا أجدع واحدة عرفتها.<br>
    > طيبة، أحلى هبلة، بتغلبني بس بحبها.
</div>

<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // إنشاء الجزيئات
    const particles = new THREE.BufferGeometry();
    const count = 3000;
    const positions = new Float32Array(count * 3);
    for(let i=0; i<count*3; i+=3) {
        let t = Math.random() * Math.PI * 2;
        positions[i] = 16 * Math.pow(Math.sin(t), 3) * 0.5;
        positions[i+1] = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.5;
        positions[i+2] = (Math.random() - 0.5) * 5;
    }
    particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({color: 0xff3e3e, size: 0.05});
    const heart = new THREE.Points(particles, material);
    scene.add(heart);

    camera.position.z = 10;

    // التأثير التفاعلي: الدوران مع الحركة
    function animate() {
        requestAnimationFrame(animate);
        heart.rotation.y += 0.01;
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
